[workspace]
resolver = "2"

members = [
    "crates/souprune",
    "crates/bevy_ecs_typewriter",
    "crates/bevy_fact_rule_event",
    "crates/bevy_mortar_bond",
    "crates/bevy_alight_motion",
    "crates/souprune_api",
    "crates/souprune_sdk",
    "crates/souprune_mod_test",
    "crates/souprune_mock_host",
    "crates/interoptopus_backend_haxe",
    "crates/flambe",
    "crates/bevy_workbench",
]

# Exclude mortar submodule - it has its own workspace
exclude = [
    "crates/mortar",
    "crates/bevy_tween",
    "crates/iyes_perf_ui",
]

# Use local mortar_compiler for bevy_mortar_bond during development
[patch.crates-io]
mortar_compiler = { path = "crates/mortar/crates/mortar_compiler" }
bevy_tween = { path = "crates/bevy_tween" }
iyes_perf_ui = { path = "crates/iyes_perf_ui" }

[workspace.lints.rust]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = 0

# Ensure audio libraries are always optimized to prevent underruns
[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonium]
opt-level = 3

# CI profile for faster builds without debug info
[profile.ci]
inherits = "release"
debug = false
strip = true
