[workspace]
resolver = "2"

members = [
    "souprune",
    "bevy_rich_text_3d_animator",
    "bevy_fact_rule_event",
    "bevy_mortar_bond"
]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
