[workspace]
resolver = "2"

members = [
    "crates/souprune",
    "crates/bevy_ecs_typewriter",
    "crates/bevy_fact_rule_event",
    "crates/bevy_mortar_bond",
    "crates/bevy_alight_motion",
    "crates/souprune_api",
    "crates/souprune_sdk",
    "crates/souprune_mod_test",
    "crates/souprune_mock_host",
    "crates/interoptopus_backend_haxe",
]

[workspace.lints.rust]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = 0

# Ensure audio libraries are always optimized to prevent underruns
[profile.dev.package.bevy_seedling]
opt-level = 3

[profile.dev.package.firewheel]
opt-level = 3

[profile.dev.package.firewheel-core]
opt-level = 3

[profile.dev.package.firewheel-graph]
opt-level = 3

[profile.dev.package.firewheel-nodes]
opt-level = 3

[profile.dev.package.firewheel-cpal]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonium]
opt-level = 3

[patch.crates-io]
# Force every workspace crate to use the local mortar compiler implementation.
mortar_compiler = { path = "../mortar/crates/mortar_compiler" }
