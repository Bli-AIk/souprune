# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste is used by metal, kira, rav1e (Bevy/image dependencies)
    # No security vulnerability, just unmaintained status
    "RUSTSEC-2024-0436",
    # GTK bindings pulled by Dioxus desktop still depend on proc-macro-error.
    "RUSTSEC-2024-0370",
    # Dioxus desktop currently uses GTK3 bindings through wry/tao on Linux.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # Font licenses (used by egui fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # LGPL-3.0-or-later is the license for souprune itself
    "LGPL-3.0-or-later",
]
# NOTE: GPL/AGPL licenses are NOT allowed.
# Any unlisted license will be rejected by cargo-deny.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
