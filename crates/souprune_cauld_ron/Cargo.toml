[package]
name = "souprune_cauld_ron"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SoupRune extension for Cauld-ron — danmaku performance constructors"
repository = "https://github.com/Bli-AIk/souprune"
exclude = [
    ".cargo/",
    ".github/"
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
souprune_schema = { path = "../souprune_schema", version = "0.2" }
toml = "1.1"
cauld-ron = { path = "../cauld-ron", version = "0.1.1", default-features = false, features = ["guest"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
cauld-ron = { path = "../cauld-ron", version = "0.1.1", default-features = false, features = ["host"] }

[[bin]]
name = "cauld-ron-deps"
path = "src/bin/deps/main.rs"
required-features = ["deps-cli"]

[features]
deps-cli = ["dep:clap"]
