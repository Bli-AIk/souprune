[package]
name = "souprune-lint"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RON file linter for SoupRune projects. Validates .view.ron and .sdf.ron files."

[[bin]]
name = "souprune-lint"
path = "src/main.rs"

[dependencies]
souprune_schema = { path = "../souprune_schema" }
ron = "0.12"
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
