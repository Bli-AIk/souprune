[package]
name = "souprune"
version = "0.5.1"
edition = "2024"
authors = ["Bli-AIk <haikun2333@gmail.com>"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/Bli-AIk/souprune"
homepage = "https://github.com/Bli-AIk/souprune"
description = "A game framework designed specifically for Deltarune / Undertale fangames."
documentation = "https://docs.rs/souprune"
readme = "../../readme.md"
keywords = ["game-framework", "deltarune", "undertale", "game-engine", "bevy"]
categories = ["game-development", "game-engines"]
exclude = [
    "target/*",
    ".github/*",
    "assets/fonts/*",
    "assets/audios/*"
]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "default_font",
    "file_watcher",
    "multi_threaded",
    "png",
    "x11",
    "wayland",
] }
bevy_shader = "0.18"
leafwing-input-manager = "0.20"
bevy_ecs_tiled = "0.11"
bevy_tween = "0.12"
iyes_perf_ui = { version = "0.5", optional = true }
bevy_ecs_typewriter = "0.2"
bevy_fact_rule_event = "0.4"
bevy_mortar_bond = "0.4"
bevy_alight_motion = "0.4"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
toml = "0.9.8"
regex = "1.10"
bevy_rand = { version = "0.14", features = ["wyrand"] }
rand = "0.10"
bevy_bitmap_text = "0.2"
bevy_kira_audio = { version = "0.25", features = ["wav", "ogg", "flac", "mp3"] }
anyhow = "1.0.100"
async-channel = "2"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.43"
chrono = "0.4.42"
fasteval = "0.2"
wasmtime = "43"
wasmtime-wasi = "44"
souprune_api = { path = "../souprune_api", version = "0.2" }
souprune_schema = { path = "../souprune_schema", version = "0.1" }
indexmap = "2"
dunce = "1.0.5"
once_cell = "1.20.2"
image = "0.25"
futures-lite = "2"

[dev-dependencies]
walkdir = "2.5.0"
proptest = "1.9.0"

[dependencies.bevy-inspector-egui]
version = "0.36.0"
optional = true

[dependencies.bevy_brp_extras]
version = "0.18"
optional = true

[dependencies.tracing-tracy]
version = "0.11"
optional = true

[features]
default = []
debug = ["dep:bevy-inspector-egui", "dep:bevy_brp_extras", "dep:iyes_perf_ui", "bevy_fact_rule_event/debug"]
experimental = []
unsafe_gpu = []
# Tracy profiling with minimal overhead (no GUI)
# Tracy 性能分析，最小开销（无 GUI）
trace_tracy = ["bevy/trace_tracy", "bevy/trace", "dep:tracing-tracy"]
# Tracy profiling with system names visible (uses bevy/debug for ECS names)
# Tracy 性能分析，可见系统名称（使用 bevy/debug 获取 ECS 名称）
debug_tracy = ["trace_tracy", "bevy/debug"]
# Android support: enables android-game-activity backend
# Android 支持：启用 android-game-activity 后端
android = ["bevy/android-game-activity"]
# Bevy debug: enables ECS debug names for better panic/error messages
# Bevy 调试：启用 ECS 调试名称，获得更详细的 panic/错误信息
bevy_debug = ["bevy/debug"]

# Android GPU backend: GLES with constrained_limits
# Vulkan: OOM + driver bugs (BiSheng GPU)
# GLES: 需要 constrained_limits 禁用 storage buffers (设备不支持 VERTEX_STORAGE)
[target.'cfg(target_os = "android")'.dependencies.bevy_render]
version = "0.18"
features = ["gles"]

[package.metadata.android]
package = "com.bliaik.souprune"
label = "SoupRune"
[package.metadata.android.sdk]
target_sdk_version = 35
min_sdk_version = 26

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
debuggable = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.application.meta_data]]
name = "android.app.lib_name"
value = "souprune"
