[package]
name = "souprune"
version = "0.5.1"
edition = "2024"
authors = ["Bli-AIk <haikun2333@gmail.com>"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/Bli-AIk/souprune"
homepage = "https://github.com/Bli-AIk/souprune"
description = "A game framework designed specifically for Deltarune / Undertale fangames."
documentation = "https://docs.rs/souprune"
readme = "../../readme.md"
keywords = ["game-framework", "deltarune", "undertale", "game-engine", "bevy"]
categories = ["game-development", "game-engines"]
exclude = [
    "target/*",
    ".github/*",
    "assets/fonts/*",
    "assets/audios/*"
]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "gltf_animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "file_watcher",
    "multi_threaded",
    "png",
    "x11",
    "wayland",
] }
bevy_shader = "0.18"
leafwing-input-manager = "0.20"
bevy_ecs_tiled = "0.11"
bevy_tween = "0.11"
iyes_perf_ui = { version = "0.5", optional = true }
bevy_ecs_typewriter = { path = "../bevy_ecs_typewriter", version = "0.2" }
bevy_fact_rule_event = { path = "../bevy_fact_rule_event", version = "0.3" }
bevy_mortar_bond = { path = "../bevy_mortar_bond", version = "0.3" }
bevy_alight_motion = { path = "../bevy_alight_motion", version = "0.3" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.10"
toml = "0.9.8"
regex = "1.10"
bevy_rich_text3d = { version = "0.6", features = ["reflect"] }
bevy_kira_audio = { version = "0.25", features = ["wav", "ogg", "flac", "mp3"], optional = true }
bevy_seedling = { version = "0.7", features = ["wav", "ogg", "flac", "mp3"], optional = true }
anyhow = "1.0.100"
async-channel = "2"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.43"
chrono = "0.4.42"
fasteval = "0.2"
proptest = "1.9.0"
libloading = "0.9.0"
souprune_api = { path = "../souprune_api", version = "0.1" }
dunce = "1.0.5"
once_cell = "1.20.2"

[dev-dependencies]
walkdir = "2.5.0"

[dependencies.bevy-inspector-egui]
version = "0.36.0"
optional = true

[dependencies.bevy_brp_extras]
version = "0.18"
optional = true

[features]
default = ["bevy_kira_audio"]
debug = ["dep:bevy-inspector-egui", "dep:bevy_brp_extras", "dep:iyes_perf_ui"]
firewheel = ["bevy_seedling"]
experimental = []
unsafe_gpu = []
