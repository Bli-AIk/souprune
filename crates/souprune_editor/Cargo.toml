[package]
name = "souprune_editor"
version = "0.1.0"
edition = "2024"
authors = ["Bli-AIk <haikun2333@gmail.com>"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/Bli-AIk/souprune"
homepage = "https://github.com/Bli-AIk/souprune"
description = "An egui-based game editor for SoupRune, built on bevy_workbench."
keywords = ["editor", "game-engine", "bevy", "souprune"]
categories = ["game-development", "game-engines", "development-tools"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_picking",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "x11",
    "wayland",
] }
bevy_workbench = { path = "../bevy_workbench", version = "0.3.2" }
bevy_egui = { version = "0.39", features = ["render"] }
bevy_fact_rule_event = "0.4.1"
bevy_tween = "0.12"
egui = "0.33"
souprune = { path = "../souprune", version = "0.5.1" }
souprune_schema = { path = "../souprune_schema", version = "0.1.0" }
ron = "0.12"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
icondata_core = "0.1"
icondata_vs = "0.1"
resvg = "0.47"
log = "0.4.29"

[features]
default = []
android = ["souprune/android"]

[lib]
name = "souprune_editor"
crate-type = ["lib", "cdylib"]
