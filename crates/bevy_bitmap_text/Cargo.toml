[package]
name = "bevy_bitmap_text"
version = "0.1.0"
edition = "2024"
description = "Glyph-as-Entity dynamic atlas text rendering for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
] }
fontdue = "0.7"
etagere = "0.2"
log = "0.4"

[dev-dependencies]
bevy = { version = "0.18" }
