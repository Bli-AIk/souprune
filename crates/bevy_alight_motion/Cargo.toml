[package]
name = "bevy_alight_motion"
version = "0.1.0"
edition = "2024"
description = "Bevy plugin for loading and playing Alight Motion project files"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0"

[dev-dependencies]
bevy = "0.17.2"

[[example]]
name = "player"
path = "examples/player.rs"
