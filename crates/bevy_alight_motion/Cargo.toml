[package]
name = "bevy_alight_motion"
version = "0.1.0"
edition = "2024"
description = "Bevy plugin for loading and playing Alight Motion project files"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.17.2", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_sprite",
    "bevy_ui",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_text",
    "x11",
    "wayland",
    "png",
] }
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0"

[dev-dependencies]
bevy = { version = "0.17.2", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_sprite",
    "bevy_ui",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_text",
    "x11",
    "wayland",
    "png",
    "multi_threaded",
] }

[[example]]
name = "player"
path = "examples/player.rs"
