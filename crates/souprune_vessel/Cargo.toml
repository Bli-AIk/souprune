[package]
name = "souprune_vessel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SoupRune extension for Vessel — danmaku performance constructors"

[dependencies]
anyhow = "1"
souprune_schema = { path = "../souprune_schema" }
souprune_vessel_macros = { path = "../souprune_vessel_macros" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.55"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vessel = { path = "../vessel" }
