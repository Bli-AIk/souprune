[package]
name = "souprune_vessel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SoupRune extension for Vessel — danmaku performance constructors"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
souprune_schema = { path = "../souprune_schema", version = "0.1" }
toml = "1.1"
wit-bindgen = "0.57"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
vessel = { path = "../vessel", version = "0.1" }

[[bin]]
name = "vessel-deps"
path = "src/bin/deps/main.rs"
required-features = ["deps-cli"]

[features]
deps-cli = ["dep:clap"]
