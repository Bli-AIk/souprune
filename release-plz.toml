# Release-plz configuration
# This file excludes git submodules from release-plz management.
# Submodules have their own release cycles in separate repositories.

[workspace]
# Allow uncommitted changes in git submodules
allow_dirty = true

# Only manage these packages (non-submodule crates)
# By explicitly listing packages, release-plz will ignore any unlisted packages including submodules
[[package]]
name = "souprune"

[[package]]
name = "souprune_api"

[[package]]
name = "souprune_sdk"

[[package]]
name = "souprune_mod_test"

[[package]]
name = "souprune_mock_host"

[[package]]
name = "interoptopus_backend_haxe"


