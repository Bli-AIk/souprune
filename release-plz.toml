# Release-plz configuration
# Excludes git submodules from release-plz management.
# Submodules have their own release cycles in separate repositories.

[workspace]
# Allow uncommitted changes in git submodules
allow_dirty = true
# Customize PR title to show package info for single/multi-package releases
# Single package: "chore: release souprune v0.5.1"
# Multiple packages: "chore: release (5 packages updated)"
pr_name = "chore{% if package and version %}: release {{ package }} v{{ version }}{% elif packages %}: release ({{ packages | length }} packages updated){% else %}: release{% endif %}"

[changelog]
# Filter out release-related commits from changelog
# This removes noise from automated release commits and merge commits
commit_parsers = [
    # Skip commits containing release-related keywords
    { message = ".*release.*", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^Merge pull request", skip = true },
    # Default parsers for conventional commits
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^.*", group = "Other" },
]

# Only manage these packages (non-submodule crates)
[[package]]
name = "souprune"

[[package]]
name = "souprune_api"

[[package]]
name = "souprune_sdk"

[[package]]
name = "souprune_mock_host"
release = false

[[package]]
name = "souprune_schema"

[[package]]
name = "bevy_bitmap_text"
release = false
changelog_update = false

[[package]]
name = "souprune-lint"
release = false

# Explicitly disable release-plz for git submodules and their sub-crates
# These have their own release workflows in their respective repositories
[[package]]
name = "bevy_alight_motion"
release = false
changelog_update = false

[[package]]
name = "bevy_ecs_typewriter"
release = false
changelog_update = false

[[package]]
name = "bevy_fact_rule_event"
release = false
changelog_update = false

[[package]]
name = "bevy_mortar_bond"
release = false
changelog_update = false

[[package]]
name = "bevy_mortar_bond_macros"
release = false
changelog_update = false

[[package]]
name = "cauld-ron"
release = false
changelog_update = false
publish = false