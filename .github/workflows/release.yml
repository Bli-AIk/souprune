name: Build and Upload Assets

on:
  push:
    tags:
      - 'v*'
      - 'souprune-v*'

permissions:
  contents: write  # Required to upload release assets

jobs:
  build-and-upload:
    name: Build and Upload
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: souprune
            asset_name: souprune-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: souprune.exe
            asset_name: souprune-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            arm_target: aarch64-apple-darwin
            artifact_name: souprune
            asset_name: souprune-macos-universal

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Checkout mortar
        uses: actions/checkout@v6
        with:
          repository: Bli-AIk/mortar
          path: temp-mortar

      - name: Move mortar to sibling directory
        shell: bash
        run: mv temp-mortar ../mortar

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxrandr-dev libx11-dev libxi-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional targets for macOS
        if: matrix.os == 'macos-latest'
        run: rustup target add ${{ matrix.arm_target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: cargo build --release --target ${{ matrix.target }} --package souprune

      - name: Build and Combine (macOS Universal Binary)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} --package souprune
          cargo build --release --target ${{ matrix.arm_target }} --package souprune
          lipo -create \
               target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
               target/${{ matrix.arm_target }}/release/${{ matrix.artifact_name }} \
               -output target/release/${{ matrix.asset_name }}
          echo "FINAL_ARTIFACT_PATH=target/release/${{ matrix.asset_name }}" >> $GITHUB_ENV

      - name: Strip binary (Linux/macOS)
        if: matrix.os == 'ubuntu-latest' || (matrix.os == 'macos-latest' && env.FINAL_ARTIFACT_PATH == '')
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package with Assets and Mods
        shell: bash
        run: |
          mkdir staging
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp ${{ env.FINAL_ARTIFACT_PATH }} staging/
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          fi
          
          [ -d "assets" ] && cp -r assets staging/
          [ -d "mods" ] && cp -r mods staging/
          
          cd staging
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a ../${{ matrix.asset_name }}.zip *
          else
            zip -r ../${{ matrix.asset_name }}.zip *
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}