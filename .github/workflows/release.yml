name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Get tag name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Simulate Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Release ${{ steps.tag_name.outputs.TAG }}
          draft: false
          prerelease: false
          body: |
            ## 更新内容 / What's Changed
            
            请查看提交历史了解详细更改。
            See commit history for detailed changes.
            
            ## 下载 / Downloads
            
            - **Linux**: souprune-linux-x86_64
            - **Windows**: souprune-windows-x86_64.exe  
            - **macOS**: souprune-macos-universal

      - name: Simulate release check (PR mode)
        if: github.event_name == 'pull_request'
        run: echo "✅ PR 模式：仅检查可否 release，不创建实际 release。"

  build-and-upload:
    name: Build and Upload
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: souprune
            asset_name: souprune-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: souprune.exe
            asset_name: souprune-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            arm_target: aarch64-apple-darwin
            artifact_name: souprune
            asset_name: souprune-macos-universal

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libx11-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional targets for macOS
        if: matrix.os == 'macos-latest'
        run: rustup target add ${{ matrix.arm_target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: cargo build --release --target ${{ matrix.target }} --package souprune

      - name: Build and Combine (macOS Universal Binary)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} --package souprune
          cargo build --release --target ${{ matrix.arm_target }} --package souprune
          lipo -create \
               target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
               target/${{ matrix.arm_target }}/release/${{ matrix.artifact_name }} \
               -output target/release/${{ matrix.asset_name }}
          echo "FINAL_ARTIFACT_PATH=target/release/${{ matrix.asset_name }}" >> $GITHUB_ENV
          echo "FINAL_ARTIFACT_NAME=${{ matrix.asset_name }}" >> $GITHUB_ENV

      - name: Strip binary (Linux and macOS)
        if: matrix.os == 'ubuntu-latest' || (matrix.os == 'macos-latest' && env.FINAL_ARTIFACT_PATH == '')
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload Release Asset
        if: github.event_name != 'pull_request' # 在 PR 时不上传到 Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.FINAL_ARTIFACT_PATH || format('target/{0}/release/{1}', matrix.target, matrix.artifact_name) }}