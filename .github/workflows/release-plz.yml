name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - &install-deps
        name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxrandr-dev libx11-dev libxi-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev pkg-config mold

      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout

      - *install-deps

      - *install-rust

      - name: Run release-plz
        id: release-plz-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        continue-on-error: true

      - name: Warn on release-plz failure
        if: steps.release-plz-pr.outcome == 'failure'
        run: |
          echo "::warning::release-plz release-pr failed — likely due to submodule version drift in old commits (see release-plz/release-plz#2595). The release job is unaffected."
