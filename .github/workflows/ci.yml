name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: souprune

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Checkout mortar
        uses: actions/checkout@v6
        with:
          repository: Bli-AIk/mortar
          path: temp-mortar

      - name: Move mortar to sibling directory
        run: mv temp-mortar ../mortar

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libx11-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config \
            mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo nextest run --workspace

  deny:
    name: Cargo Deny
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Checkout mortar
        uses: actions/checkout@v6
        with:
          repository: Bli-AIk/mortar
          path: temp-mortar

      - name: Move mortar to sibling directory
        run: mv temp-mortar ../mortar

      - uses: EmbarkStudios/cargo-deny-action@v2

  security:
    name: Security Audit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Checkout mortar
        uses: actions/checkout@v6
        with:
          repository: Bli-AIk/mortar
          path: temp-mortar

      - name: Move mortar to sibling directory
        run: mv temp-mortar ../mortar

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
